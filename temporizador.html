<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporizador para clases</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --border: #dadce0;
  --text: #202124;
  --muted: #5f6368;
  --blue: #4285f4;
  --green: #34a853;
  --red: #ea4335;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  padding: 16px;
}

.wrap { width: min(980px, 100%); margin: 0 auto; }
.back { display: inline-flex; gap: 8px; text-decoration: none; color: var(--text); margin-bottom: 14px; font-weight: 700; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 6px 20px rgba(60, 64, 67, 0.08);
  padding: 22px;
}

.hero { display: grid; gap: 6px; margin-bottom: 18px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
p { margin: 0; color: var(--muted); }

.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.card { border: 1px solid var(--border); border-radius: 20px; padding: 16px; background: #fff; }

.display {
  display: grid;
  place-items: center;
  min-height: 320px;
  text-align: center;
}

.time {
  font-size: clamp(3rem, 12vw, 6.5rem);
  font-weight: 700;
  letter-spacing: -0.05em;
  margin: 0;
}

.status { margin-top: 8px; font-size: 1.05rem; }

.controls { display: grid; gap: 12px; }
.preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

button, input {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 12px 14px;
  font-size: 16px;
}

button { cursor: pointer; font-weight: 700; }
.primary { background: var(--blue); color: white; border: none; }
.success { background: var(--green); color: white; border: none; }
.danger { background: var(--red); color: white; border: none; }
.secondary { background: #f8f9fa; color: var(--text); }

button:hover { filter: brightness(0.98); }
input:focus { outline: none; border-color: rgba(66, 133, 244, 0.55); box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.12); }

.note { font-size: 0.92rem; color: var(--muted); }

@media (max-width: 820px) { .layout, .pair, .preset-row { grid-template-columns: 1fr 1fr; } .layout { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  body { padding: 10px; }
  .panel { padding: 16px; border-radius: 18px; }
  .preset-row, .pair { grid-template-columns: 1fr; }
  button, input { font-size: 15px; }
  .display { min-height: 220px; }
}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Temporizador para clases</h1>
        <p>Un temporizador simple con botones rápidos, duración personalizada y aviso al terminar.</p>
      </div>

      <div class="layout">
        <div class="card display">
          <div>
            <p class="time" id="time">15:00</p>
            <p class="status" id="status">Listo para iniciar</p>
          </div>
        </div>

        <div class="card controls">
          <div class="preset-row">
            <button type="button" class="secondary" onclick="setMinutes(5)">5 min</button>
            <button type="button" class="secondary" onclick="setMinutes(10)">10 min</button>
            <button type="button" class="secondary" onclick="setMinutes(15)">15 min</button>
            <button type="button" class="secondary" onclick="setMinutes(20)">20 min</button>
            <button type="button" class="secondary" onclick="setMinutes(30)">30 min</button>
            <button type="button" class="secondary" onclick="toggleFullscreen()">Pantalla completa</button>
          </div>

          <div class="pair">
            <div>
              <label for="custom">Personalizado (minutos)</label>
              <input id="custom" type="number" min="1" placeholder="Ej. 12">
            </div>
            <div style="display:grid; align-items:end;">
              <button type="button" class="secondary" onclick="applyCustom()">Usar personalizado</button>
            </div>
          </div>

          <div class="pair">
            <button type="button" class="primary" onclick="startTimer()">INICIAR</button>
            <button type="button" class="danger" onclick="resetTimer()">Reiniciar</button>
          </div>

          <div class="pair">
            <button type="button" class="secondary" onclick="pauseTimer()">Pausar</button>
            <button type="button" class="secondary" onclick="resumeTimer()">Continuar</button>
          </div>

          <div class="note">Cuando termine verás un aviso y el temporizador se detendrá automáticamente.</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    let defaultSeconds = 15 * 60;
    let secondsLeft = defaultSeconds;
    let intervalId = null;
    let running = false;

    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function render() {
      timeEl.textContent = formatTime(secondsLeft);
    }

    function stopInterval() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
      running = false;
    }

    function beep() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContextClass();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.08;
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start();
        setTimeout(() => {
          oscillator.stop();
          audio.close();
        }, 600);
      } catch (error) {
        alert('🔔 ¡Tiempo terminado!');
      }
    }

    function finishTimer() {
      stopInterval();
      statusEl.textContent = '🔔 ¡Tiempo terminado!';
      beep();
    }

    function startTimer() {
      stopInterval();
      running = true;
      statusEl.textContent = 'En marcha...';
      intervalId = setInterval(() => {
        if (secondsLeft <= 0) {
          finishTimer();
          return;
        }
        secondsLeft -= 1;
        render();
      }, 1000);
    }

    function pauseTimer() {
      stopInterval();
      statusEl.textContent = 'Pausado';
    }

    function resumeTimer() {
      if (running || secondsLeft <= 0) return;
      startTimer();
    }

    function resetTimer() {
      stopInterval();
      secondsLeft = defaultSeconds;
      statusEl.textContent = 'Listo para iniciar';
      render();
    }

    function setMinutes(minutes) {
      defaultSeconds = Math.max(1, minutes) * 60;
      secondsLeft = defaultSeconds;
      statusEl.textContent = `Preparado para ${minutes} minutos`;
      render();
    }

    function applyCustom() {
      const minutes = parseInt(document.getElementById('custom').value, 10);
      if (!minutes || minutes < 1) {
        alert('Ingresa un valor valido en minutos.');
        return;
      }
      setMinutes(minutes);
    }

    function toggleFullscreen() {
      const element = document.documentElement;
      if (!document.fullscreenElement) {
        element.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    render();
  </script>
</body>
</html>
