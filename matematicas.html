<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de ejercicios matemáticos</title>
<style>
:root { --bg:#f8f9fa; --panel:#ffffff; --border:#dadce0; --text:#202124; --muted:#5f6368; --blue:#4285f4; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%); padding: 16px; }
.wrap { width: min(1100px, 100%); margin: 0 auto; }
.back { display: inline-flex; gap: 8px; text-decoration: none; color: var(--text); margin-bottom: 14px; font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 1px 3px rgba(60,64,67,.12), 0 6px 20px rgba(60,64,67,.08); padding: 22px; }
.hero { display: grid; gap: 6px; margin-bottom: 18px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
p { margin: 0; color: var(--muted); }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
.card { border: 1px solid var(--border); border-radius: 20px; padding: 16px; background: #fff; }
label { display: block; font-weight: 700; margin: 0 0 8px; }
input, button, select { width: 100%; border-radius: 14px; border: 1px solid var(--border); padding: 12px 14px; font-size: 16px; }
input, select { outline: none; }
input:focus, select:focus { border-color: rgba(66,133,244,.55); box-shadow: 0 0 0 3px rgba(66,133,244,.12); }
button { cursor: pointer; font-weight: 700; margin-top: 10px; }
.primary { background: var(--blue); color: white; border: none; }
.secondary { background: #f8f9fa; color: var(--text); }
.grid { display: grid; gap: 12px; }
.exercise, .answer { border: 1px solid var(--border); border-radius: 18px; padding: 14px; background: #fafafa; }
.exercise h3, .answer h3 { margin: 0 0 8px; }
.math-line { font-size: 1.1rem; font-weight: 700; }
.note { margin-top: 10px; color: var(--muted); font-size: 0.92rem; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
@media (max-width: 520px) { body { padding: 10px; } .panel { padding: 16px; border-radius: 18px; } input, button, select { font-size: 15px; } }
@media print { body { background: #fff; padding: 0; } .back, .card:first-child, button { display: none !important; } .panel { box-shadow: none; border: none; padding: 0; } .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Generador de ejercicios matemáticos</h1>
        <p>Genera hojas de práctica con operaciones aleatorias y respuestas incluidas.</p>
      </div>

      <div class="layout">
        <div class="card grid">
          <div>
            <label for="cantidad">Cantidad de ejercicios</label>
            <input id="cantidad" type="number" min="1" max="50" value="10">
          </div>
          <div>
            <label for="rango">Rango de números</label>
            <input id="rango" type="number" min="2" max="999" value="20">
          </div>
          <div>
            <label for="operacion">Operacion</label>
            <select id="operacion">
              <option value="mix">Mezcladas</option>
              <option value="add">Sumas</option>
              <option value="sub">Restas</option>
              <option value="mul">Multiplicaciones</option>
              <option value="div">Divisiones exactas</option>
            </select>
          </div>
          <button class="primary" type="button" onclick="generar()">Generar ejercicios</button>
          <button class="secondary" type="button" onclick="window.print()">Descargar</button>
          <div class="note">Se genera una hoja de ejercicios y otra de respuestas.</div>
        </div>

        <div class="grid">
          <div class="exercise">
            <h3>Ejercicios</h3>
            <div id="ejercicios"></div>
          </div>
          <div class="answer">
            <h3>Respuestas</h3>
            <div id="respuestas"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function crearOperacion(tipo, rango) {
      if (tipo === 'add') {
        const a = randomInt(1, rango);
        const b = randomInt(1, rango);
        return { text: `${a} + ${b} = ____`, answer: a + b };
      }
      if (tipo === 'sub') {
        const a = randomInt(1, rango);
        const b = randomInt(1, a);
        return { text: `${a} - ${b} = ____`, answer: a - b };
      }
      if (tipo === 'mul') {
        const a = randomInt(1, rango);
        const b = randomInt(1, Math.max(2, Math.min(rango, 12)));
        return { text: `${a} × ${b} = ____`, answer: a * b };
      }
      if (tipo === 'div') {
        const divisor = randomInt(1, Math.max(2, Math.min(rango, 12)));
        const answer = randomInt(1, rango);
        const dividend = divisor * answer;
        return { text: `${dividend} ÷ ${divisor} = ____`, answer };
      }

      const operations = ['add', 'sub', 'mul', 'div'];
      return crearOperacion(operations[randomInt(0, operations.length - 1)], rango);
    }

    function generar() {
      const cantidad = Math.max(1, parseInt(document.getElementById('cantidad').value, 10) || 1);
      const rango = Math.max(2, parseInt(document.getElementById('rango').value, 10) || 20);
      const operacion = document.getElementById('operacion').value;
      const ejercicios = [];

      for (let i = 0; i < cantidad; i++) {
        ejercicios.push(crearOperacion(operacion, rango));
      }

      document.getElementById('ejercicios').innerHTML = ejercicios.map((item, index) => `
        <div class="math-line">${index + 1}. ${item.text}</div>
      `).join('');

      document.getElementById('respuestas').innerHTML = ejercicios.map((item, index) => `
        <div class="math-line">${index + 1}. ${item.answer}</div>
      `).join('');
    }

    generar();
  </script>
</body>
</html>
