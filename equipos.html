<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de equipos</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --border: #dadce0;
  --text: #202124;
  --muted: #5f6368;
  --blue: #4285f4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  padding: 16px;
}

.wrap {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 14px;
  font-weight: 700;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 6px 20px rgba(60, 64, 67, 0.08);
  padding: 22px;
}

.hero {
  display: grid;
  gap: 6px;
  margin-bottom: 20px;
}

h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
p { margin: 0; color: var(--muted); }

.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.card {
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  background: #fff;
}

label { display: block; font-weight: 700; margin: 0 0 8px; }
textarea, input, button {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 12px 14px;
  font-size: 16px;
}

textarea { min-height: 220px; resize: vertical; }

input, textarea { outline: none; }

input:focus, textarea:focus {
  border-color: rgba(66, 133, 244, 0.55);
  box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.12);
}

button {
  background: var(--blue);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 700;
  margin-top: 10px;
}

.teams {
  display: grid;
  gap: 12px;
}

.team {
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: #fafafa;
}

.team h3 { margin: 0 0 8px; }
.team ul { margin: 0; padding-left: 18px; }

.note { margin-top: 12px; color: var(--muted); font-size: 0.92rem; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  body { padding: 10px; }
  .panel { padding: 16px; border-radius: 18px; }
  textarea, input, button { font-size: 15px; }
}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Generador de equipos</h1>
        <p>Para profesores. Escribe nombres, define cuántos equipos quieres y revuelve la lista.</p>
      </div>

      <div class="layout">
        <div class="card">
          <label for="nombres">Nombres</label>
          <textarea id="nombres" placeholder="Juan\nPedro\nMaría\nCarlos\nAna\nLuis">Juan
Pedro
María
Carlos
Ana
Luis</textarea>

          <label for="cantidad" style="margin-top:12px;">Número de equipos</label>
          <input id="cantidad" type="number" min="1" value="3">

          <button type="button" onclick="revolverEquipos()">🔀 Revolver equipos</button>
          <div class="note">El reparto es aleatorio y reparte nombres lo más parejo posible.</div>
        </div>

        <div class="card">
          <div class="teams" id="resultado"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function mezclar(lista) {
      const arr = [...lista];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function revolverEquipos() {
      const nombres = document.getElementById('nombres').value
        .split(/\n|,/) 
        .map((nombre) => nombre.trim())
        .filter(Boolean);
      const cantidad = Math.max(1, parseInt(document.getElementById('cantidad').value, 10) || 1);
      const resultado = document.getElementById('resultado');

      if (!nombres.length) {
        resultado.innerHTML = '<div class="team"><h3>Agrega nombres</h3><p>Escribe al menos un nombre para formar equipos.</p></div>';
        return;
      }

      const equipos = Array.from({ length: cantidad }, (_, index) => ({ nombre: `EQUIPO ${index + 1}`, integrantes: [] }));
      mezclar(nombres).forEach((nombre, index) => {
        equipos[index % cantidad].integrantes.push(nombre);
      });

      resultado.innerHTML = equipos.map((equipo) => `
        <div class="team">
          <h3>${equipo.nombre}</h3>
          <ul>
            ${equipo.integrantes.map((integrante) => `<li>${integrante}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    revolverEquipos();
  </script>
</body>
</html>
