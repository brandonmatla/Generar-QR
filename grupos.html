<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de grupos aleatorios</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --border: #dadce0;
  --text: #202124;
  --muted: #5f6368;
  --blue: #4285f4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  padding: 16px;
}

.wrap { width: min(1100px, 100%); margin: 0 auto; }
.back { display: inline-flex; gap: 8px; text-decoration: none; color: var(--text); margin-bottom: 14px; font-weight: 700; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 6px 20px rgba(60, 64, 67, 0.08);
  padding: 22px;
}

.hero { display: grid; gap: 6px; margin-bottom: 20px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
p { margin: 0; color: var(--muted); }

.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.card { border: 1px solid var(--border); border-radius: 20px; padding: 16px; background: #fff; }

label { display: block; font-weight: 700; margin: 0 0 8px; }
textarea, input, button {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 12px 14px;
  font-size: 16px;
}

textarea { min-height: 180px; resize: vertical; }
input, textarea { outline: none; }
input:focus, textarea:focus { border-color: rgba(66, 133, 244, 0.55); box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.12); }
button { background: var(--blue); color: white; border: none; cursor: pointer; font-weight: 700; margin-top: 10px; }

.groups { display: grid; gap: 12px; }
.group { padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: #fafafa; }
.group h3 { margin: 0 0 8px; }
.group ul { margin: 0; padding-left: 18px; }
.inline { display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { margin-top: 12px; color: var(--muted); font-size: 0.92rem; }

@media (max-width: 820px) { .layout, .pair { grid-template-columns: 1fr; } }
@media (max-width: 520px) { body { padding: 10px; } .panel { padding: 16px; border-radius: 18px; } textarea, input, button { font-size: 15px; } }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Generador de grupos aleatorios</h1>
        <p>Perfecto para actividades. Agrega alumnos o usa una cantidad total, elige cuántos grupos quieres y genera el reparto.</p>
      </div>

      <div class="layout">
        <div class="card inline">
          <label for="alumnos">Nombres de alumnos</label>
          <textarea id="alumnos" placeholder="Uno por línea">Alumno 1
Alumno 2
Alumno 3
Alumno 4
Alumno 5
Alumno 6
Alumno 7
Alumno 8
Alumno 9
Alumno 10
Alumno 11
Alumno 12
Alumno 13
Alumno 14
Alumno 15
Alumno 16
Alumno 17
Alumno 18
Alumno 19
Alumno 20
Alumno 21
Alumno 22
Alumno 23
Alumno 24
Alumno 25
Alumno 26
Alumno 27
Alumno 28
Alumno 29
Alumno 30</textarea>

          <div class="pair">
            <div>
              <label for="grupos">Número de grupos</label>
              <input id="grupos" type="number" min="1" value="5">
            </div>
            <div>
              <label for="total">O total de alumnos</label>
              <input id="total" type="number" min="1" value="30">
            </div>
          </div>

          <div class="pair">
            <div>
              <label for="evitar1">Evitar que X y Y estén juntos</label>
              <input id="evitar1" type="text" placeholder="Nombre X">
            </div>
            <div>
              <label for="evitar2">&nbsp;</label>
              <input id="evitar2" type="text" placeholder="Nombre Y">
            </div>
          </div>

          <button type="button" onclick="generarGrupos()">🎯 Generar grupos</button>
          <div class="note">Si dejas el texto vacío, se crean alumnos automáticos hasta el total indicado.</div>
        </div>

        <div class="card">
          <div class="groups" id="resultado"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function generarAlumnos() {
      const custom = document.getElementById('alumnos').value.split(/\n|,/).map((item) => item.trim()).filter(Boolean);
      const total = Math.max(1, parseInt(document.getElementById('total').value, 10) || 1);
      if (custom.length) return custom;
      return Array.from({ length: total }, (_, index) => `Alumno ${index + 1}`);
    }

    function intentarSeparar(equipos, x, y) {
      if (!x || !y) return;
      const indexX = equipos.findIndex((grupo) => grupo.includes(x));
      const indexY = equipos.findIndex((grupo) => grupo.includes(y));
      if (indexX === -1 || indexY === -1 || indexX !== indexY) return;

      const grupo = equipos[indexX];
      const posX = grupo.indexOf(x);
      const posY = grupo.indexOf(y);
      if (posX === -1 || posY === -1) return;

      for (let i = 0; i < equipos.length; i++) {
        if (i === indexX) continue;
        const otro = equipos[i][0];
        if (!otro) continue;
        const posOtro = equipos[i].indexOf(otro);
        equipos[i][posOtro] = x;
        grupo[posX] = otro;
        return;
      }
    }

    function generarGrupos() {
      const alumnos = shuffle(generarAlumnos());
      const grupos = Math.max(1, parseInt(document.getElementById('grupos').value, 10) || 1);
      const evitar1 = document.getElementById('evitar1').value.trim();
      const evitar2 = document.getElementById('evitar2').value.trim();
      const resultado = document.getElementById('resultado');

      const equipos = Array.from({ length: grupos }, () => []);
      alumnos.forEach((alumno, index) => {
        equipos[index % grupos].push(alumno);
      });

      intentarSeparar(equipos, evitar1, evitar2);

      resultado.innerHTML = equipos.map((grupo, index) => `
        <div class="group">
          <h3>Grupo ${index + 1}</h3>
          <ul>
            ${grupo.map((alumno) => `<li>${alumno}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    generarGrupos();
  </script>
</body>
</html>
