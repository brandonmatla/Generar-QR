<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de nombres</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --border: #dadce0;
  --text: #202124;
  --muted: #5f6368;
  --blue: #4285f4;
  --red: #ea4335;
  --yellow: #fbbc05;
  --green: #34a853;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  padding: 16px;
}

.wrap {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 14px;
  font-weight: 700;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 6px 20px rgba(60, 64, 67, 0.08);
  padding: 22px;
}

.hero {
  display: grid;
  gap: 6px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: clamp(1.8rem, 4vw, 3rem);
}

p {
  margin: 0;
  color: var(--muted);
}

.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  align-items: start;
}

.card {
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  background: #fff;
}

label {
  display: block;
  font-weight: 700;
  margin: 0 0 8px;
}

textarea, button {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 12px 14px;
  font-size: 16px;
}

textarea {
  min-height: 220px;
  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: rgba(66, 133, 244, 0.55);
  box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.12);
}

button {
  cursor: pointer;
  font-weight: 700;
  margin-top: 10px;
}

.primary {
  background: var(--blue);
  color: white;
  border: none;
}

.secondary {
  background: #f8f9fa;
  color: var(--text);
}

.wheel-area {
  display: grid;
  gap: 14px;
  justify-items: center;
}

.wheel-box {
  position: relative;
  width: min(100%, 420px);
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
}

.pointer {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 28px solid var(--red);
  z-index: 2;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 10px solid #ffffff;
  box-shadow: 0 12px 30px rgba(60, 64, 67, 0.16);
  overflow: hidden;
  transform: rotate(0deg);
  transition: transform 5s cubic-bezier(0.12, 0.77, 0.17, 1);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.result {
  width: 100%;
  text-align: center;
  padding: 16px;
  border-radius: 18px;
  background: #f8f9fa;
  border: 1px solid var(--border);
}

.result strong {
  display: block;
  margin-top: 6px;
  font-size: clamp(1.4rem, 4vw, 2rem);
  color: var(--blue);
}

.hint {
  font-size: 0.92rem;
}

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  body { padding: 10px; }
  .panel { padding: 16px; border-radius: 18px; }
  textarea, button { font-size: 15px; }
  .wheel-box { width: min(100%, 340px); }
}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Ruleta de nombres</h1>
        <p>Escribe una lista de nombres, gira la ruleta y deja que elija un participante al azar.</p>
      </div>

      <div class="layout">
        <div class="card">
          <label for="nombres">Nombres</label>
          <textarea id="nombres" placeholder="Uno por línea">Juan
Pedro
María
Carlos
Ana
Luis</textarea>
          <button class="primary" type="button" onclick="girar()">🎰 Girar ruleta</button>
          <p class="hint" style="margin-top:10px;">La ruleta se adapta a cualquier tamaño de pantalla y puedes usar Enter para girarla.</p>
        </div>

        <div class="card wheel-area">
          <div class="wheel-box">
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel" id="wheelWrap">
              <canvas id="wheelCanvas"></canvas>
            </div>
          </div>
          <div class="result">
            Resultado
            <strong id="winner">Listo para girar</strong>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const textarea = document.getElementById('nombres');
    const wheelCanvas = document.getElementById('wheelCanvas');
    const wheelWrap = document.getElementById('wheelWrap');
    const winnerEl = document.getElementById('winner');
    const ctx = wheelCanvas.getContext('2d');

    let rotation = 0;
    let spinning = false;

    const colors = ['#4285f4', '#ea4335', '#fbbc05', '#34a853', '#8ab4f8', '#f28b82', '#fdd663', '#81c995'];

    function getNames() {
      return textarea.value.split(/\n|,/).map((name) => name.trim()).filter(Boolean);
    }

    function resizeCanvas() {
      const size = wheelCanvas.clientWidth || 360;
      const ratio = window.devicePixelRatio || 1;
      wheelCanvas.width = size * ratio;
      wheelCanvas.height = size * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawWheel();
    }

    function drawWheel() {
      const names = getNames();
      const size = wheelCanvas.clientWidth || 360;
      const radius = size / 2;
      ctx.clearRect(0, 0, size, size);

      if (!names.length) {
        ctx.fillStyle = '#f1f3f4';
        ctx.beginPath();
        ctx.arc(radius, radius, radius - 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5f6368';
        ctx.font = `700 ${Math.max(16, size * 0.08)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Agrega nombres', radius, radius);
        return;
      }

      const slice = Math.PI * 2 / names.length;
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate((-rotation * Math.PI) / 180);
      ctx.translate(-radius, -radius);

      names.forEach((name, index) => {
        const start = -Math.PI / 2 + index * slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 6, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = `700 ${Math.max(12, size * 0.05)}px Arial`;
        const text = name.length > 18 ? `${name.slice(0, 18)}...` : name;
        ctx.fillText(text, radius - 18, 0);
        ctx.restore();
      });

      ctx.restore();

      ctx.beginPath();
      ctx.arc(radius, radius, Math.max(16, size * 0.07), 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#dadce0';
      ctx.stroke();
    }

    function girar() {
      if (spinning) return;
      const names = getNames();
      if (!names.length) {
        alert('Ingresa al menos un nombre.');
        return;
      }

      spinning = true;
      const index = Math.floor(Math.random() * names.length);
      const slice = 360 / names.length;
      const target = rotation + 1800 + (360 - (index + 0.5) * slice);

      wheelWrap.style.transform = `rotate(${target}deg)`;
      rotation = target % 360;

      const chosenName = names[index];
      winnerEl.textContent = 'Girando...';

      setTimeout(() => {
        winnerEl.textContent = chosenName;
        spinning = false;
      }, 5000);
    }

    function cargarEjemplo() {
      textarea.value = 'Juan\nPedro\nMaría\nCarlos\nAna\nLuis';
      drawWheel();
    }

    textarea.addEventListener('input', drawWheel);
    textarea.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        girar();
      }
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
