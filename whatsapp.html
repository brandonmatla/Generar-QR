<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de enlace de WhatsApp</title>
<style>
:root { --bg:#f8f9fa; --panel:#ffffff; --border:#dadce0; --text:#202124; --muted:#5f6368; --blue:#4285f4; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%); padding: 16px; }
.wrap { width: min(1100px, 100%); margin: 0 auto; }
.back { display: inline-flex; gap: 8px; align-items: center; text-decoration: none; color: var(--text); margin-bottom: 14px; font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 1px 3px rgba(60,64,67,.12), 0 6px 20px rgba(60,64,67,.08); padding: 22px; }
.hero { display: grid; gap: 6px; margin-bottom: 18px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); }
p { margin: 0; color: var(--muted); }
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.card { border: 1px solid var(--border); border-radius: 20px; padding: 16px; background: #fff; }
label { display: block; font-weight: 700; margin: 0 0 8px; }
input, textarea, button { width: 100%; border-radius: 14px; border: 1px solid var(--border); padding: 12px 14px; font-size: 16px; }
textarea { min-height: 180px; resize: vertical; outline: none; }
input, textarea { outline: none; }
input:focus, textarea:focus { border-color: rgba(66,133,244,.55); box-shadow: 0 0 0 3px rgba(66,133,244,.12); }
button { cursor: pointer; font-weight: 700; margin-top: 10px; }
.primary { background: var(--blue); color: white; border: none; }
.secondary { background: #f8f9fa; color: var(--text); }
.output { display: grid; gap: 12px; }
.result { border: 1px solid var(--border); border-radius: 18px; padding: 14px; background: #fafafa; word-break: break-all; }
.result strong { display: block; margin-top: 4px; color: var(--blue); }
.note { margin-top: 10px; color: var(--muted); font-size: .92rem; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
@media (max-width: 520px) { body { padding: 10px; } .panel { padding: 16px; border-radius: 18px; } input, textarea, button { font-size: 15px; } }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al menú</a>
    <section class="panel">
      <div class="hero">
        <h1>Generador de enlace de WhatsApp</h1>
        <p>Crea un enlace directo para abrir una conversación con mensaje incluido.</p>
      </div>

      <div class="layout">
        <div class="card">
          <label for="telefono">Número de teléfono</label>
          <input id="telefono" type="text" placeholder="521234567890" value="521234567890">
          <label for="mensaje" style="margin-top:12px;">Mensaje</label>
          <textarea id="mensaje" placeholder="Escribe tu mensaje aquí">Hola, quiero más información.</textarea>
          <button class="primary" type="button" onclick="generar()">Generar enlace</button>
          <button class="secondary" type="button" onclick="copiar()">Copiar enlace</button>
          <div class="note">Usa el formato internacional sin signos ni espacios.</div>
        </div>

        <div class="output">
          <div class="card">
            <h2 style="margin:0 0 10px; font-size:1.1rem;">Enlace</h2>
            <div class="result"><span id="urlTexto">Listo para generar</span><strong id="urlFinal"></strong></div>
          </div>
          <div class="card">
            <h2 style="margin:0 0 10px; font-size:1.1rem;">Abrir</h2>
            <button class="primary" type="button" onclick="abrir()">Abrir WhatsApp</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    let enlaceActual = '';

    function generar() {
      const telefono = document.getElementById('telefono').value.trim().replace(/\D/g, '');
      const mensaje = document.getElementById('mensaje').value.trim();
      const urlTexto = document.getElementById('urlTexto');
      const urlFinal = document.getElementById('urlFinal');

      if (!telefono) {
        alert('Ingresa un número de teléfono.');
        return;
      }

      enlaceActual = `https://wa.me/${telefono}${mensaje ? `?text=${encodeURIComponent(mensaje)}` : ''}`;
      urlTexto.textContent = 'Enlace generado';
      urlFinal.textContent = enlaceActual;
    }

    function abrir() {
      if (!enlaceActual) {
        generar();
      }
      if (enlaceActual) {
        window.open(enlaceActual, '_blank', 'noopener,noreferrer');
      }
    }

    async function copiar() {
      if (!enlaceActual) {
        generar();
      }
      if (!enlaceActual) return;
      try {
        await navigator.clipboard.writeText(enlaceActual);
        alert('Enlace copiado.');
      } catch (error) {
        alert('No se pudo copiar el enlace.');
      }
    }

    generar();
  </script>
</body>
</html>
